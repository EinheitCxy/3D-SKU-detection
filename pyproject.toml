[project]
name = "3d-sku-detection"
version = "0.1.0"
description = "3D SKU Detection and Clustering Analysis System"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Core scientific computing
    "numpy==1.26.4",
    "scipy>=1.10.1",
    "pandas>=1.5.0",
    # Machine learning (core)
    "torch==2.7.1",
    "torchvision==0.22.1",
    "xformers==0.0.31",
    "scikit-learn>=1.3.2",
    "scikit-image>=0.20.0",  # LAB色彩空间转换（可视化增强）
    # Computer vision
    "opencv-python-headless==4.11.0.86",
    "Pillow>=9.0.0",
    "pycocotools>=2.0.7",  # Required for SAM3 COCO format support
    # SAM3 dependencies
    "psutil>=5.9.0",  # sam3_video_predictor 运行时依赖（此前由 viser 传递引入）
    "timm>=1.0.17",  # Vision transformers for SAM3
    "ftfy==6.1.1",  # Text formatting
    "regex",  # Regular expressions
    "iopath>=0.1.10",  # I/O utilities
    # DA3 runtime (source remains vendored in Depth-Anything-3/)
    "addict",
    "omegaconf",
    "e3nn",
    "evo",
    "imageio",
    "moviepy==1.0.3",
    "pillow-heif",
    "plyfile",
    "pycolmap",
    "requests",
    "typer>=0.9.0",
    # 3D processing and visualization
    "trimesh>=4.0.0",
    "ipywidgets>=8.0.4",  # Required by Open3D's Python 3.11 runtime
    # Deep learning utilities
    "einops>=0.6.0",
    # Utilities
    "colorlog>=6.9.0",
    "rich>=13.0.0", # 进度条和格式化输出
    "pyyaml>=6.0.2",
    "huggingface-hub>=0.34.2",
    "safetensors>=0.5.3",
    "matplotlib>=3.7.5",
    "shapely>=2,<3",
    "open3d>=0.19.0",
    "faiss-cpu>=1.8.0.post1",
    # BSON API runtime
    "fastapi",
    "uvicorn",
    "bson",
]

[project.optional-dependencies]
demo = [
    "gradio>=4.0.0",
]

vggt = [
    "huggingface_hub>=0.22.0",
    "roma>=1.3.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0; python_version>='3.8.1'",
]

# 调试和可视化工具（可选）
debug = [
    "matplotlib>=3.7.0",
]

# GPU加速（可选，需要CUDA环境）
# 重要限制:
#   - faiss-gpu 在 PyPI 上的最新版本是 1.7.2，仅支持 Python 3.8-3.10
#   - Python 3.11+ 必须使用 conda 安装 faiss-gpu 1.8.0（不在PyPI上）
#   - 命令: conda install -c pytorch -c nvidia faiss-gpu=1.8.0
gpu = [
    "faiss-gpu>=1.7.0,<1.8.0; python_version<'3.11'",  # GPU加速（仅Python 3.8-3.10）
    "cupy-cuda12x>=12.0.0",  # GPU加速的数组操作（CUDA 12.x）
]

# CPU加速（推荐，支持所有Python版本 3.8-3.12）
accelerate = [
    "faiss-cpu>=1.7.0",  # CPU加速的最近邻搜索（性能提升3-5倍）
]

all = [
    "3d-sku-detection[demo,vggt,dev]"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
find-links = ["docker/wheels"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "utils*", "docker*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 88

[project.scripts]
sku-detection = "main:main"
