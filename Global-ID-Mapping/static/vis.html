<script type="module">
    import { BSON } from './bson.mjs'
    window.BSON = BSON
</script>
<style>
    #previews {
        width: 100%;
        position: relative;
    }
    #previews > div {
        box-sizing: content-box;
        border: solid 3px rebeccapurple;
        margin: 10px;
        position: relative;
        display: inline-block;
    }
    #previews > div > div {
        position: absolute;
        box-sizing: border-box;
        border: solid 3px rgba(0, 200, 0, 0.9);
    }
    #previews > div > div.deduplicated {
        border-color: rgba(200, 0, 0, 0.6);
        background-color: rgba(200, 0, 0, 0.1);
    }
    #previews > div > div > span {
        position: absolute;
        top: -18px;
        left: 0;
        background: rgba(0, 200, 0, 0.9);
        color: white;
        font-size: 10px;
        padding: 1px 3px;
    }
    #previews > div > div.deduplicated > span {
        background: rgba(200, 0, 0, 0.8);
    }
</style>
<div id="previews"></div>
<script>
    function init(inputBSON, outputBSON) {
        try {
            if (!inputBSON || !outputBSON) return;

            const inputs = BSON.deserialize(inputBSON);
            const outputs = BSON.deserialize(outputBSON);

            if (!inputs || !Object.keys(inputs).length || !outputs || !Object.keys(outputs).length) return;

            const previews = document.getElementById("previews");
            previews.innerHTML = '';

            // 创建图片预览
            for (let selectedFile of inputs.images) {
                let imgURL = window.URL.createObjectURL(new Blob([selectedFile.buffer]));

                let previewImage = document.createElement("div");
                let style = previewImage.style;
                style.background = "url(" + imgURL + ")";
                previews.appendChild(previewImage);

                let image = new Image();
                image.src = imgURL;
                image.onload = function() {
                    style.height = this.height + "px";
                    style.width = this.width + "px";
                    style.zoom = 480 / this.width;
                };
            }

            let imgs = document.querySelectorAll("#previews > div");

            // 处理 global_skus
            const globalSkus = outputs.global_skus || [];

            for (let [index, result] of globalSkus.entries()) {
                let skuData = typeof result === 'string' ? JSON.parse(result) : result;

                if (!imgs[index]) continue;
                imgs[index].innerHTML = "";

                const objects = skuData.objects || [];

                for (const obj of objects) {
                    const isDeduplicated = obj.is_deduplicated || false;
                    const globalId = obj.global_id !== undefined ? obj.global_id : null;
                    const [x1, y1, x2, y2] = obj.position || [0, 0, 0, 0];

                    let inner = document.createElement("div");
                    if (isDeduplicated) {
                        inner.className = "deduplicated";
                    }

                    inner.style.top = y1 + "px";
                    inner.style.left = x1 + "px";
                    inner.style.width = (x2 - x1) + "px";
                    inner.style.height = (y2 - y1) + "px";

                    // 标签
                    const label = document.createElement("span");
                    label.textContent = `GID:${globalId !== null ? globalId : '?'}`;
                    inner.appendChild(label);

                    // tooltip
                    let tooltip = `Global ID: ${globalId}\n`;
                    tooltip += `状态: ${isDeduplicated ? '已去重' : '保留'}`;
                    if (obj.confidences && obj.confidences.det !== undefined) {
                        tooltip += `\n置信度: ${(obj.confidences.det * 100).toFixed(1)}%`;
                    }
                    inner.title = tooltip;

                    imgs[index].appendChild(inner);
                }
            }

            // 调整iframe高度
            setTimeout(() => {
                const height = document.getElementById('previews').offsetHeight;
                window.parent.document.getElementById('iframe').height = height > 300 ? height + 20 : 300;
            }, 300);

        } catch (e) {
            alert(e);
        }
    }
</script>
