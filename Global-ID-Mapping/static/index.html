<html>

<head>
    <title>Image Fetcher</title>
    <style>
        label,
        #submit {
            border: 1px solid #ccc;
            display: inline-block;
            padding: 10px 24px;
            cursor: pointer;
            background-color: cornflowerblue;
            margin: 5px;
        }

        #images {
            width: 100%;
            position: relative;
        }

        #images>img {
            box-sizing: content-box;
            border: solid 10px rebeccapurple;
            margin: 10px;
            position: relative;
            display: inline-block;
            width: 480px;
        }

        #previews {
            width: 100%;
            position: relative;
        }

        #previews>div {
            box-sizing: content-box;
            border: solid 10px rebeccapurple;
            margin: 10px;
            position: relative;
            display: inline-block;
        }

        textarea {
            width: 80%;
            min-height: 200px;
        }

        span {
            display: block;
            border: solid 1px darkcyan;
            margin: 5px;
            padding: 5px;
            background-color: cornsilk;
        }
    </style>
    <script type="module">
        import { BSON } from './bson.mjs'
        function readFile(file) {
            return new Promise((resolve, reject) => {
                var fr = new FileReader();
                fr.onload = () => resolve(new BSON.Binary(fr.result));
                fr.readAsArrayBuffer(file);
            });
        }
        let selectedFiles;
        document.getElementsByTagName("input")[0].onchange = async function () {//preview
            const selectedFilesPreviews = document.getElementById("files").files;
            if (selectedFilesPreviews.length == 0) return
            var previews = document.getElementById("previews")
            previews.innerHTML = ''
            for (let selectedFile of selectedFilesPreviews) {
                var imgURL = window.URL.createObjectURL(new Blob([selectedFile]))
                let previewImage = document.createElement("div");
                let style = previewImage.style;
                style.background = "url(" + imgURL + ")"
                previews.appendChild(previewImage)

                var image = new Image();
                image.src = imgURL;
                image.onload = function () {
                    style.height = this.height + "px"
                    style.width = this.width + "px"
                    style.zoom = 480 / this.width;
                }
            }
            selectedFiles = await Promise.all(Array.from(document.getElementById("files").files).map(o => readFile(o)));
        }

        document.getElementById("submit").onclick = async function () {
            var inputs = {}
            document.querySelectorAll("input").forEach(e => {
                if (e.type == "checkbox") {
                    inputs[e.id] = e.checked
                }
            })
            var data = document.getElementById('txtdata').value
            data = data === '' ? JSON.parse('{}') : JSON.parse(data);
            if ((selectedFiles != undefined) && (selectedFiles.length != 0)) {
                data['images'] = selectedFiles
            }
            inputs['data'] = BSON.serialize(data)
            fetch('/api', {
                body: BSON.serialize(inputs),
                headers: { 'content-type': 'application/octet-stream' },
                method: 'POST',
            })
                .then((response) => response.arrayBuffer())
                .then((buffer) => BSON.deserialize(buffer))
                .then((data) => {
                    for (let [index, result] of data.informations.entries()) {
                        data.informations[index] = JSON.parse(result)
                    }
                    document.getElementById("data").value = JSON.stringify(BSON.deserialize(data.data.buffer), null, 2)
                    document.getElementById("informations").value = JSON.stringify(data.informations, null, 2)
                    images.innerHTML = '';
                    for (let image of data.images) {
                        let previewImage = document.createElement("img");
                        previewImage.src = "data:image/png;base64," + image.toString("base64");
                        images.appendChild(previewImage)
                    }

                })
        }

    </script>
</head>

<body>
    <h1>下载分离图片数据：把 data 属性内的 images 转为可视图像</h1>
    <h1>Input</h1>
    <span>
        <h2>data</h2>
        <textarea id="txtdata"></textarea>
    </span>
    <span>
        <h2>images - 选择文件以 Binary 模式覆盖 data 内 images</h2>
        <label for="files" class="button">Select Files</label>
        <input type="file" id="files" multiple="multiple" hidden="true"></input>
        <div id="previews"></div>
    </span>
    <span>
        <h2>根据 Exif 信息旋转</h2>
        <input type="checkbox" id="rotate_by_exif" value="false" /><label
            for="rotate_by_exif">rotate_by_exif</label><br />
    </span>
    <label id="submit" class="button">Submit</label>

    <h1>Output</h1>
    <span>
        <h2>images</h2>
        <div id="images"></div>
        <h2>informations</h2>
        <textarea id="informations"></textarea>
        <h2>data</h2>
        <textarea id="data"></textarea>
    </span>

</body>

</html>
