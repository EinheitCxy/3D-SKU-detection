<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surfel full-scene A/B</title>
    <style>
      html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; background: #20242a; color: white; }
      #app { height: 100%; display: grid; grid-template-rows: 57px minmax(0, 1fr); }
      #toolbar { display: flex; flex-wrap: nowrap; gap: 10px; align-items: center; height: 57px; box-sizing: border-box; padding: 10px 12px; background: #15181c; overflow-x: auto; white-space: nowrap; }
      button, select, input { height: 30px; box-sizing: border-box; }
      button { padding: 5px 10px; cursor: pointer; }
      button[aria-pressed="true"] { background: #427df5; color: white; }
      #radius { width: 76px; }
      #status { margin-left: auto; color: #b9c2ce; }
      #stage { min-height: 0; position: relative; }
      canvas { width: 100%; height: 100%; display: block; }
      #label { position: absolute; left: 12px; bottom: 10px; padding: 5px 8px; background: #000c; pointer-events: none; }
    </style>
  </head>
  <body><div id="app"><div id="toolbar">
    <label>Scene <select id="scene"><option value="video1">video1 full (default)</option><option value="video2">video2 full</option><option value="video3">legacy video3 crop</option><option value="fd6">legacy fd6 crop</option></select></label>
    <span>Renderer</span><button data-arm="baseline">Before</button><button data-arm="candidate">After</button><button data-arm="uniform">Uniform (lazy)</button>
    <span>View</span><button data-view="overview">Full overview</button><button data-view="close">Close</button><button data-view="source">Source camera</button>
    <label>Source <select id="frame"></select></label>
    <label>Point size <input id="radius" type="number" min="0.004" max="0.008" step="0.0001" value="0.004" /></label>
    <span id="status">loading</span>
  </div><div id="stage"><canvas id="view"></canvas><div id="label"></div></div></div>
  <script type="module" src="/main.ts"></script></body>
</html>
