<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surfel final extent A/B</title>
    <style>
      html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; background: #20242a; color: white; }
      #app { height: 100%; display: grid; grid-template-rows: 57px 1fr; }
      #toolbar { display: flex; flex-wrap: nowrap; gap: 12px; align-items: center; height: 57px; box-sizing: border-box; padding: 10px 14px; background: #15181c; overflow-x: auto; white-space: nowrap; }
      button { padding: 6px 12px; cursor: pointer; }
      button[aria-pressed="true"] { background: #427df5; color: white; }
      #status { margin-left: auto; color: #b9c2ce; }
      #stage { min-height: 0; position: relative; }
      canvas { width: 100%; height: 100%; display: block; }
      #label { position: absolute; left: 12px; bottom: 10px; padding: 5px 8px; background: #000a; pointer-events: none; }
    </style>
  </head>
  <body><div id="app"><div id="toolbar">
    <label>Scene <select id="scene"><option value="video3">video3 crop</option><option value="fd6">fd6 crop</option></select></label>
    <span>Renderer</span><button data-arm="baseline">Before</button><button data-arm="uniform">Uniform</button><button data-arm="candidate">After (Axis cap)</button>
    <span>View</span><button data-view="overview">Overview</button><button data-view="close">Close</button><button data-view="side">Side</button>
    <label>Point size <input id="radius" type="number" min="0.004" max="0.008" step="0.0001" value="0.004" /></label>
    <span id="status">loading</span>
  </div><div id="stage"><canvas id="view"></canvas><div id="label"></div></div></div>
  <script type="module" src="/main.ts"></script></body>
</html>
