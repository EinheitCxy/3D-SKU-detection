[project]
name = "3d-count"
version = "0.1.0"
description = "3D SKU Detection and Clustering Analysis System"
readme = "README.md"
requires-python = ">=3.8,<3.13"
dependencies = [
    "gradio>=4.44.1",
    "scipy>=1.10.1",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "pygltflib==1.15.0",
    "matplotlib>=3.7.5",
    "scikit-learn>=1.3.2",
    "trimesh>=4.7.1",
    "opencv-python>=4.12.0.88",
    "open3d>=0.19.0",
    "viser>=0.2.11",
    "lightning>=2.3.3",
    "einops>=0.8.1",
    "pycolmap>=3.12.3",
    "hydra-core>=1.3.2",
    "pydantic==2.10.6",
]
