[project]
authors = [{name = "Jianyuan Wang", email = "jianyuan@robots.ox.ac.uk"}]
dependencies = [
    "numpy==1.26.1",
    "pillow",
    "huggingface_hub",
    "einops",
    "safetensors",
    "opencv-python",
    "gradio==5.17.1",
    "viser==0.2.23",
    "tqdm>=4.67.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "trimesh>=4.7.1",
    "pydantic==2.10.6",
    "requests>=2.32.4",
    "scipy>=1.15.3",
    "onnxruntime>=1.22.1",
    "torch==2.3.1",
    "matplotlib>=3.10.5",
    "torchvision==0.18.1",
]
name = "vggt"
requires-python = ">= 3.10"
version = "0.0.1"

[project.optional-dependencies]
demo = [
    "gradio==5.17.1",
    "viser==0.2.23",
    "tqdm",
    "hydra-core",
    "omegaconf",
    "opencv-python",
    "scipy",
    "onnxruntime",
    "requests",
    "trimesh",
    "matplotlib",
]

# Using setuptools as the build backend
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# setuptools configuration
[tool.setuptools.packages.find]
where = ["."]
include = ["vggt*"]

# Pixi configuration
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
vggt = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
demo = { features = ["demo"], solve-group = "default" }

[tool.pixi.tasks]
